# The board is a function, not a file.
#
# It renders from whatever the crawl box has published into Netlify Blobs, so
# there is nothing to rebuild when the numbers change -- a refresh is one POST
# to /api/publish. publish points at public/, which holds nothing but a
# .gitkeep. There is deliberately no index.html: a static file at "/" would be
# served ahead of the function that belongs there.

[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    # The board is open to anyone with the URL, but it is a progress readout
    # for one crawl, not a page anyone should reach from a search for a
    # registration number. Nothing here is secret; it is simply not content.
    X-Robots-Tag = "noindex, nofollow"

# Netlify has no mapping for .webmanifest and falls back to
# application/octet-stream. A manifest served as a generic binary is ignored
# outright, which takes the Android home-screen icon with it.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
